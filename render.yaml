services:
  - type: web
    name: gmail-bulk-sender
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start:all
    disk:
      name: uploads-data
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gmail-bulk-sender-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: gmail-bulk-sender-db
    databaseName: bulkmail
    user: bulkmail_user
    plan: starter
